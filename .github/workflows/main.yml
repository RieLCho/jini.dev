name: Deploy

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Deploy to server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.REMOTE_IP }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.REMOTE_IDENTITYFILE }}
                  port: ${{ secrets.REMOTE_PORT }}
                  script: |
                      cd /home/ubuntu/workspace/jini.dev
                      echo "cd into project directory"
                      sudo git switch main
                      echo "switched to main branch"
                      sudo git pull
                      echo "pulled latest changes"
                      sudo yarn install --frozen-lockfile
                      echo "dependencies installed"
                      sudo yarn build
                      echo "project built"
                      sudo rm -rf /var/www/jini.dev/*
                      echo "old files removed"
                      sudo cp -r dist /var/www/jini.dev
                      echo "dist copied to /var/www/jini.dev"
                      sudo systemctl restart nginx
                      echo "nginx restarted"
