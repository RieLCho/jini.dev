server {
    listen 80;
    server_name jini.dev www.jini.dev;

    # HTTP를 HTTPS로 리다이렉트
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jini.dev www.jini.dev;

    # SSL 인증서 설정 (Let's Encrypt 사용)
    ssl_certificate /etc/letsencrypt/live/jini.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jini.dev/privkey.pem;

    # 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 프론트엔드 정적 파일 제공
    location / {
        root /var/www/jini.dev;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 라우팅
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
} 